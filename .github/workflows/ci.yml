name: FlowForge CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.1.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ─── Lint & Typecheck ────────────────────────────────────────────────────────

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

  # ─── Unit Tests ─────────────────────────────────────────────────────────────

  test-core:
    name: Core Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build core
        run: pnpm --filter @flowforge/core build
      - name: Run core tests
        run: pnpm --filter @flowforge/core test -- --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: packages/core/coverage/

  test-backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build dependencies
        run: pnpm turbo run build --filter=@flowforge/backend^...
      - name: Run backend unit tests
        run: pnpm --filter @flowforge/backend test -- --testPathPattern="unit" --coverage
        env:
          FLOWFORGE_ENCRYPTION_KEY: test-encryption-key-32-chars!!!!
          JWT_SECRET: test-jwt-secret-32-chars-long!!!!

  # ─── Integration Tests ───────────────────────────────────────────────────────

  test-backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowforge_test
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm turbo run build --filter=@flowforge/backend
      - name: Run integration tests (SQLite mode)
        run: pnpm --filter @flowforge/backend test -- --testPathPattern="integration" --coverage
        env:
          DB_TYPE: sqlite
          DB_SQLITE_DATABASE: ':memory:'
          FLOWFORGE_ENCRYPTION_KEY: test-encryption-key-32-chars!!!!
          JWT_SECRET: test-jwt-secret-32-chars-long!!!!
          LOG_LEVEL: error
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: packages/backend/coverage/

  # ─── Frontend Tests ──────────────────────────────────────────────────────────

  test-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run Vitest
        run: pnpm --filter @flowforge/frontend test -- --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: packages/frontend/coverage/

  # ─── Build ──────────────────────────────────────────────────────────────────

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint, test-core, test-backend-unit, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm turbo run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: |
            packages/*/dist
            packages/frontend/dist
          retention-days: 7

  # ─── Docker Build & Push ─────────────────────────────────────────────────────

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build, test-backend-integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}-worker
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── E2E Tests (only on main) ────────────────────────────────────────────────

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @flowforge/frontend exec playwright install --with-deps chromium
      - name: Build packages
        run: pnpm turbo run build
      - name: Run E2E tests
        run: pnpm --filter @flowforge/frontend test:e2e
        env:
          DB_TYPE: sqlite
          DB_SQLITE_DATABASE: ':memory:'
          FLOWFORGE_ENCRYPTION_KEY: test-encryption-key-32-chars!!!!
          JWT_SECRET: test-jwt-secret-32-chars-long!!!!
          LOG_LEVEL: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/frontend/playwright-report/
          retention-days: 7

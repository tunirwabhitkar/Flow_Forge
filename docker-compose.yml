version: '3.9'

# ─── Shared config ────────────────────────────────────────────────────────────
x-flowforge-base: &flowforge-base
  image: flowforge:latest
  build:
    context: .
    dockerfile: Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &flowforge-env
    NODE_ENV: production
    DB_TYPE: postgres
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_PORT: 5432
    DB_POSTGRESDB_DATABASE: flowforge
    DB_POSTGRESDB_USER: flowforge
    DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-flowforge_secret}
    REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
    FLOWFORGE_ENCRYPTION_KEY: ${FLOWFORGE_ENCRYPTION_KEY:?FLOWFORGE_ENCRYPTION_KEY is required}
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    BINARY_DATA_STORAGE_PATH: /data/binary-data
    LOG_LEVEL: ${LOG_LEVEL:-info}
    FLOWFORGE_WEBHOOK_URL: ${FLOWFORGE_WEBHOOK_URL:-http://localhost:5678}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    SENTRY_DSN: ${SENTRY_DSN:-}
  volumes:
    - flowforge-data:/data
  restart: unless-stopped

services:

  # ─── Main API Server ─────────────────────────────────────────────────────────
  flowforge:
    <<: *flowforge-base
    container_name: flowforge-api
    command: node packages/backend/dist/index.js
    environment:
      <<: *flowforge-env
      EXECUTIONS_MODE: queue
      FLOWFORGE_CONCURRENCY_PRODUCTION_LIMIT: 5
    ports:
      - "${FLOWFORGE_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Queue Workers ────────────────────────────────────────────────────────────
  flowforge-worker:
    <<: *flowforge-base
    container_name: flowforge-worker
    command: node packages/backend/dist/worker.js
    environment:
      <<: *flowforge-env
      EXECUTIONS_MODE: queue
      FLOWFORGE_CONCURRENCY_PRODUCTION_LIMIT: 10
    deploy:
      replicas: 2
    depends_on:
      flowforge:
        condition: service_healthy

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: flowforge-postgres
    environment:
      POSTGRES_DB: flowforge
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowforge_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: flowforge-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: flowforge-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - flowforge
    restart: unless-stopped

  # ─── Prometheus (Optional) ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: flowforge-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    profiles: ["monitoring"]
    restart: unless-stopped

  # ─── Grafana (Optional) ───────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: flowforge-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    profiles: ["monitoring"]
    restart: unless-stopped

volumes:
  flowforge-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  default:
    name: flowforge-network
    driver: bridge
